title: Weston Westenborg
brand: Weston Westenborg
description: Writing and projects from Weston Westenborg, co-founder of allUP.
url: https://westenb.org
author:
  name: Weston Westenborg
  url: https://westenb.org/about/

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      layout: "default"

# Preview images (_plugins/og_images.rb): the domain printed on every card,
# and the subtitle on the shared card for home, about, archive, projects, tags.
og_card:
  domain: westenb.org
  site_subtitle: "Builder & co-founder of allUP. I write about basketball, hiring, technology, and whatever I'm building."

# Tag pages with fewer posts than this are noindex and left out of the sitemap.
tag_index_min_posts: 3

include:
  - _headers

exclude:
  - ruby
  - vendor
  - docs
  - thoughts
  - script
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - CLAUDE.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
